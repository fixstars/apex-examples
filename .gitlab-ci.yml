# .gitlab-ci.yml — apex-examples CI
#
# Two jobs:
#   - lint (every MR) — runs tests/lint.py, the CI-owned structure +
#     open-source-readiness + docs-contract rules.
#   - docs:publish (on <pkg>-v<semver> tag push) — builds & publishes a
#     per-example docs archive to this project's generic package registry,
#     which apex-marketplace-serve fetches+bakes into the tutorials section
#     of its MkDocs site (ADR-0006 §2.3).
#
# The publish script (scripts/publish-docs.sh) is a no-op (exit 0) for tags
# that are not <pkg>-v<semver>, so the rules can stay broad (any tag) without
# spurious failures.

stages:
  - lint
  - publish

# Lint on every MR and on main. Catches open-source-readiness issues (internal
# host leaks — this repo goes public on GitHub), docs-contract violations, and
# structure regressions before they land.
lint:
  stage: lint
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 tests/lint.py

# Publish docs archive on tag push. Tags are the release act (ADR-0001 L2
# gate), so the docs archive is cut at the same moment the plugin tag is
# released. Re-running the pipeline on the same tag overwrites the package
# version (idempotent, matches serve's generic-package behavior).
docs:publish:
  stage: publish
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl tar
  script:
    - bash scripts/publish-docs.sh "$CI_COMMIT_TAG"
